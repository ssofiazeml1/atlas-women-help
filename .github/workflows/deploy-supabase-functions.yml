name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy shared site API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            'https://api.supabase.com/v1/projects/wyupfhbfknzizvcmqqbc/functions/deploy?slug=site-content' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --form 'metadata={"entrypoint_path":"index.ts","name":"site-content","verify_jwt":false}' \
            --form 'file=@supabase/functions/site-content/index.ts;filename=index.ts;type=application/typescript'
